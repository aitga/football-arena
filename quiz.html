var QUIZ = [{"l": "eng", "q": "Which club went a whole Premier League season unbeaten in 2003-04?", "o": ["Arsenal", "Manchester United", "Chelsea", "Liverpool"], "fact": "Arsenal's 'Invincibles' won 26 and drew 12 of their 38 league games, and were given a special gold trophy."}, {"l": "eng", "q": "Who is the Premier League's all-time top scorer?", "o": ["Alan Shearer", "Wayne Rooney", "Harry Kane", "Thierry Henry"], "fact": "Alan Shearer scored 260 Premier League goals for Blackburn Rovers and Newcastle United."}, {"l": "eng", "q": "In which year did the Premier League begin?", "o": ["1992", "1988", "1996", "2000"], "fact": "The first Premier League season was 1992-93. Manchester United were the first champions."}, {"l": "eng", "q": "Which club won the 2015-16 Premier League after starting the season as 5000-1 outsiders?", "o": ["Leicester City", "Tottenham Hotspur", "Everton", "West Ham United"], "fact": "Leicester City, managed by Claudio Ranieri, pulled off one of the biggest surprises in sports history."}, {"l": "eng", "q": "Which stadium is nicknamed 'The Theatre of Dreams'?", "o": ["Old Trafford", "Anfield", "Emirates Stadium", "Stamford Bridge"], "fact": "Old Trafford, home of Manchester United, got the nickname from club legend Sir Bobby Charlton."}, {"l": "eng", "q": "What is the oldest football competition in the world?", "o": ["The FA Cup", "The Copa América", "The Scottish Cup", "The Champions League"], "fact": "The FA Cup was first played in 1871-72. Wanderers won the first final."}, {"l": "esp", "q": "'El Clásico' is the match between Real Madrid and which club?", "o": ["Barcelona", "Atlético Madrid", "Sevilla", "Valencia"], "fact": "El Clásico is one of the most watched club matches on the planet, followed by hundreds of millions of fans."}, {"l": "esp", "q": "What is the name of Barcelona's famous home stadium?", "o": ["Camp Nou", "Santiago Bernabéu", "Mestalla", "Metropolitano"], "fact": "Camp Nou opened in 1957 and is the biggest stadium in Europe."}, {"l": "esp", "q": "Who is LaLiga's all-time top scorer?", "o": ["Lionel Messi", "Cristiano Ronaldo", "Telmo Zarra", "Raúl"], "fact": "Lionel Messi scored 474 LaLiga goals for Barcelona between 2004 and 2021."}, {"l": "esp", "q": "In which year did Spain win their first World Cup?", "o": ["2010", "2006", "2014", "1982"], "fact": "Andrés Iniesta scored the winner against the Netherlands in extra time of the 2010 final in South Africa."}, {"l": "esp", "q": "Which club has won the most LaLiga titles?", "o": ["Real Madrid", "Barcelona", "Atlético Madrid", "Athletic Club"], "fact": "Real Madrid have won more than 35 Spanish league titles, more than any other club."}, {"l": "ita", "q": "Which Italian club is nicknamed 'La Vecchia Signora' (The Old Lady)?", "o": ["Juventus", "AC Milan", "Roma", "Napoli"], "fact": "Juventus, from Turin, have won more Serie A titles than any other club."}, {"l": "ita", "q": "The 'Derby della Madonnina' is played between which two clubs?", "o": ["AC Milan and Inter", "Roma and Lazio", "Juventus and Torino", "Genoa and Sampdoria"], "fact": "Both Milan clubs share the same stadium, San Siro, and take turns being the home team."}, {"l": "ita", "q": "How many World Cups has Italy won?", "o": ["4", "2", "3", "5"], "fact": "Italy won the World Cup in 1934, 1938, 1982 and 2006."}, {"l": "ita", "q": "Diego Maradona led which Italian club to its first Serie A titles?", "o": ["Napoli", "Juventus", "Fiorentina", "Lazio"], "fact": "With Maradona, Napoli won Serie A in 1987 and 1990. Their stadium is now named after him."}, {"l": "ita", "q": "What famous defensive style is linked with Italian football?", "o": ["Catenaccio", "Tiki-taka", "Gegenpressing", "Total Football"], "fact": "Catenaccio means 'door bolt' – a tight defence with a sweeper behind the back line."}, {"l": "ger", "q": "Which club has won the most Bundesliga titles?", "o": ["Bayern Munich", "Borussia Dortmund", "Hamburg", "Borussia Mönchengladbach"], "fact": "Bayern Munich have won more than 30 German titles, including 11 in a row from 2013 to 2023."}, {"l": "ger", "q": "Which club's fans form the famous 'Yellow Wall'?", "o": ["Borussia Dortmund", "Bayer Leverkusen", "Werder Bremen", "Schalke 04"], "fact": "The Yellow Wall is the South Stand at Dortmund's stadium, Europe's largest standing terrace for about 25,000 fans."}, {"l": "ger", "q": "Which team ended Bayern's long title run by winning the 2023-24 Bundesliga unbeaten?", "o": ["Bayer Leverkusen", "RB Leipzig", "Borussia Dortmund", "VfB Stuttgart"], "fact": "Xabi Alonso's Leverkusen won their first ever German title without losing a single league game."}, {"l": "ger", "q": "How many World Cups has Germany won?", "o": ["4", "3", "2", "5"], "fact": "Germany won in 1954, 1974, 1990 and 2014. Mario Götze scored the winner in the 2014 final."}, {"l": "ger", "q": "What is the name of Bayern Munich's stadium?", "o": ["Allianz Arena", "Signal Iduna Park", "Olympiastadion", "Veltins-Arena"], "fact": "The outside of the Allianz Arena can light up in different colours."}, {"l": "fra", "q": "'Le Classique' is the big match between PSG and which club?", "o": ["Marseille", "Lyon", "Monaco", "Lille"], "fact": "Marseille were the first French club to win the Champions League, in 1993."}, {"l": "fra", "q": "France won the World Cup in 1998 and in which other year?", "o": ["2018", "2006", "2014", "2022"], "fact": "In 2018 France beat Croatia 4-2 in Moscow. Kylian Mbappé scored in the final aged 19."}, {"l": "fra", "q": "Which French legend scored twice in the 1998 World Cup final?", "o": ["Zinedine Zidane", "Thierry Henry", "Michel Platini", "Didier Deschamps"], "fact": "Zidane scored two headers as France beat Brazil 3-0 at the Stade de France."}, {"l": "fra", "q": "Which club has won the most Ligue 1 titles?", "o": ["Paris Saint-Germain", "Saint-Étienne", "Marseille", "Lyon"], "fact": "PSG passed Saint-Étienne's record of 10 titles in the 2020s."}, {"l": "eur", "q": "Which club has won the European Cup / Champions League the most times?", "o": ["Real Madrid", "AC Milan", "Bayern Munich", "Liverpool"], "fact": "Real Madrid have won it 15 times, including the first five editions from 1956 to 1960."}, {"l": "eur", "q": "Who is the all-time top scorer in the Champions League?", "o": ["Cristiano Ronaldo", "Lionel Messi", "Robert Lewandowski", "Raúl"], "fact": "Cristiano Ronaldo scored 140 Champions League goals for Manchester United, Real Madrid and Juventus."}, {"l": "eur", "q": "Which country won Euro 2024 in Germany?", "o": ["Spain", "England", "France", "Italy"], "fact": "Spain beat England 2-1 in the final in Berlin, winning their record fourth European title."}, {"l": "eur", "q": "Which team came back from 3-0 down at half-time to win the 2005 Champions League final?", "o": ["Liverpool", "AC Milan", "Chelsea", "Barcelona"], "fact": "'The Miracle of Istanbul': Liverpool scored three goals in six minutes and won on penalties."}, {"l": "eur", "q": "What is the theme song played before Champions League matches called?", "o": ["The Champions League Anthem", "Ode to Joy", "You'll Never Walk Alone", "Seven Nation Army"], "fact": "The anthem was written by Tony Britten in 1992 and is based on a piece by Handel."}, {"l": "wld", "q": "Which country hosted and won the first World Cup in 1930?", "o": ["Uruguay", "Brazil", "Italy", "Argentina"], "fact": "Uruguay beat Argentina 4-2 in the first final in Montevideo."}, {"l": "wld", "q": "Which country has won the most World Cups?", "o": ["Brazil", "Germany", "Italy", "Argentina"], "fact": "Brazil have won five: 1958, 1962, 1970, 1994 and 2002."}, {"l": "wld", "q": "Which country won the 2022 World Cup in Qatar?", "o": ["Argentina", "France", "Croatia", "Morocco"], "fact": "Argentina beat France on penalties after a 3-3 draw, one of the greatest finals ever."}, {"l": "wld", "q": "Which was the first African team to reach a World Cup semi-final?", "o": ["Morocco", "Cameroon", "Senegal", "Ghana"], "fact": "Morocco's Atlas Lions beat Belgium, Spain and Portugal on the way to the 2022 semi-final."}, {"l": "wld", "q": "What is the nickname of Morocco's national team?", "o": ["The Atlas Lions", "The Pharaohs", "The Super Eagles", "The Desert Foxes"], "fact": "The name comes from the Atlas lion, which once lived in the Atlas Mountains of North Africa."}, {"l": "wld", "q": "Which country has won the most Africa Cup of Nations titles?", "o": ["Egypt", "Cameroon", "Ghana", "Nigeria"], "fact": "Egypt have won the AFCON seven times, including three in a row from 2006 to 2010."}, {"l": "wld", "q": "How many World Cups did Pelé win with Brazil?", "o": ["3", "2", "1", "4"], "fact": "Pelé is the only player to win three World Cups: 1958, 1962 and 1970."}, {"l": "wld", "q": "Who has won the most Ballon d'Or awards?", "o": ["Lionel Messi", "Cristiano Ronaldo", "Michel Platini", "Johan Cruyff"], "fact": "Lionel Messi has won the Ballon d'Or a record eight times."}, {"l": "wld", "q": "Which three countries are hosting the 2026 World Cup?", "o": ["USA, Canada and Mexico", "USA, Brazil and Mexico", "Canada, Mexico and Colombia", "USA, Canada and Argentina"], "fact": "The 2026 World Cup is the first with 48 teams and the first hosted by three countries."}];
var cat = "all", qs = [], i = 0, score = 0, box = document.getElementById("box");
function shuffle(a){ a = a.slice(); for (var j = a.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)), t = a[j]; a[j] = a[k]; a[k] = t; } return a; }
function esc(t){ var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function t(k, v){ return window.FA ? FA.t(k, v) : k; }
function tq(q){ var L = window.FA ? FA.lang : "en", x = (window.FA_QUIZ[L] || [])[QUIZ.indexOf(q)]; return x || [q.q, q.fact]; }
function to(o){ var L = window.FA ? FA.lang : "en"; return (window.FA_OPT[L] || {})[o] || o; }
function start(){
  qs = shuffle(QUIZ.filter(function(q){ return cat === "all" || q.l === cat; })).slice(0, 10);
  i = 0; score = 0; show();
}
function show(){
  var q = qs[i], tr = tq(q), opts = shuffle(q.o.map(function(o, k){ return [o, k]; }));
  box.innerHTML = '<div class="prog"><span>' + esc(t("qz_q", {i: i + 1, n: qs.length})) + '</span><span>' + esc(t("qz_score")) + ': ' + score + '</span></div>'
    + '<div class="pbar"><i style="width:' + (i / qs.length * 100) + '%"></i></div><p id="q">' + esc(tr[0]) + '</p>'
    + opts.map(function(o){ return '<button class="opt" data-k="' + o[1] + '">' + esc(to(o[0])) + '</button>'; }).join("")
    + '<div id="fact"></div><button class="btn" id="next" style="display:none">' + esc(i + 1 < qs.length ? t("qz_next") : t("qz_see")) + '</button>';
  box.querySelectorAll(".opt").forEach(function(b){
    b.onclick = function(){
      var ok = b.dataset.k === "0";
      if (ok) score++;
      box.querySelectorAll(".opt").forEach(function(x){ x.disabled = true; if (x.dataset.k === "0") x.classList.add("right"); });
      if (!ok) b.classList.add("wrong");
      var f = document.getElementById("fact");
      f.innerHTML = (ok ? "✅ <b>" + esc(t("qz_ok")) + "</b> " : "❌ " + esc(t("qz_no")) + " <b>" + esc(to(q.o[0])) + "</b>. ") + "<br>💡 " + esc(tr[1]);
      f.style.display = "block"; document.getElementById("next").style.display = "inline-block";
    };
  });
  document.getElementById("next").onclick = function(){ i++; i < qs.length ? show() : end(); };
}
function end(){
  var p = score / qs.length, msg = t(p === 1 ? "qz_m1" : p >= .7 ? "qz_m2" : p >= .4 ? "qz_m3" : "qz_m4");

  document.getElementById("again").onclick = start;
}
document.querySelectorAll(".chip").forEach(function(b){
  b.onclick = function(){ document.querySelectorAll(".chip").forEach(function(x){ x.classList.toggle("on", x === b); }); cat = b.dataset.f; start(); };
});
document.addEventListener("fa:lang", start);
start();
