name: Cartoon recaps (after each match)

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes: looks for big-league matches that just finished
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fast-recaps
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.check.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - id: check
        run: python recap.py check
      - if: steps.check.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - if: steps.check.outputs.count != '0'
        run: pip install pillow edge-tts gtts
      - if: steps.check.outputs.count != '0'
        run: python recap.py make
      - if: steps.check.outputs.count != '0'
        run: |
          git config user.name "football-arena-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recapped.json
          git commit -m "Recapped matches" || echo "no changes"
          git pull --rebase origin main
          git push
      - if: steps.check.outputs.count != '0'
        id: up
        uses: actions/upload-artifact@v4
        with:
          name: recaps
          path: out/
      - if: steps.check.outputs.count != '0'
        run: echo "[Watch the recap videos here](${{ steps.up.outputs.artifact-url }}) (zip). If they look good, click Review deployments → approval → Approve and deploy." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: make
    if: needs.make.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - uses: actions/download-artifact@v4
        with:
          name: recaps
          path: out/
      - run: python recap.py publish
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
