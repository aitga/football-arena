name: Update website

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python build.py
      - run: |
          git config user.name "football-arena-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A index.html latest.json tables.html sitemap.xml robots.txt matches
          git commit -m "Update news and highlights" || echo "no changes"
          git pull --rebase origin main
          git push
